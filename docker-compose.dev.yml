services:
  frontend:
    image: node:24-slim
    working_dir: /app
    ports:
      - "3000:3000"
    # 1. Map your local folder to the container folder for live updates
    volumes:
      - .:/app
      - /app/node_modules # Prevents your local node_modules from overriding container node_modules
    # 2. Spin up Next.js in development mode instead of production standalone
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
